# Workflow TEMPORARIO de investigacao: o RecompZel-Launcher.exe (variante atual, csc.exe + stub que
# escreve arquivos e abre powershell oculto com -ExecutionPolicy Bypass) esta sendo marcado pelo
# Windows Defender como "Trojan:Win32/Bearfoos.A!ml" (falso positivo heuristico/ML) no download dos
# usuarios. Este workflow compila 3 variantes de empacotamento e escaneia cada uma com o Windows
# Defender ja presente no runner windows-latest, para comparar qual abordagem reduz a deteccao.
#
# So roda manualmente (workflow_dispatch). Nao publica nada, nao mexe nas releases.
# Depois de concluida a investigacao este arquivo deve ser removido.
name: "[Teste] Empacotamento do launcher x Defender"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Set-Content -Path recompzel\build.txt -Value '999' -NoNewline -Encoding ASCII

      - name: "Variante A: atual (csc.exe, janela oculta, -ExecutionPolicy Bypass)"
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $res = @('/resource:recompzel\build.txt,rz.build.txt')
          foreach ($f in 'launcher.ps1','build-game.ps1','env-recompzel.ps1','install-tools.ps1','post-install.ps1','criar-atalhos.ps1','medir-rodada.ps1','monitor-build.ps1','atualizar-fork.ps1','recompzel.ico') {
            $res += "/resource:recompzel\$f,rz.$f"
          }
          & $csc /nologo /target:winexe /optimize+ /out:out\A-atual.exe /win32icon:recompzel\recompzel.ico /reference:System.Windows.Forms.dll @res recompzel\exe\LauncherStub.cs
          if ($LASTEXITCODE -ne 0) { throw "csc (A) falhou" }

      - name: "Variante B: mesmo stub, sem janela oculta e sem -ExecutionPolicy Bypass"
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          (Get-Content recompzel\exe\LauncherStub.cs -Raw) `
            -replace '-WindowStyle Hidden ', '' `
            -replace '-ExecutionPolicy Bypass ', '' `
            -replace 'CreateNoWindow = true,', 'CreateNoWindow = false,' |
            Set-Content out\LauncherStubB.cs
          $res = @('/resource:recompzel\build.txt,rz.build.txt')
          foreach ($f in 'launcher.ps1','build-game.ps1','env-recompzel.ps1','install-tools.ps1','post-install.ps1','criar-atalhos.ps1','medir-rodada.ps1','monitor-build.ps1','atualizar-fork.ps1','recompzel.ico') {
            $res += "/resource:recompzel\$f,rz.$f"
          }
          & $csc /nologo /target:winexe /optimize+ /out:out\B-sem-hidden-bypass.exe /win32icon:recompzel\recompzel.ico /reference:System.Windows.Forms.dll @res out\LauncherStubB.cs
          if ($LASTEXITCODE -ne 0) { throw "csc (B) falhou" }

      - name: "Variante C: instalador Inno Setup em vez de stub caseiro"
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup nao encontrado neste runner, pulando variante C"
            exit 0
          }
          & $iscc recompzel\exe\launcher-test.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      - name: Listar o que foi gerado
        shell: pwsh
        run: Get-ChildItem out -Filter *.exe | Format-Table Name, Length

      - name: Escanear cada variante com o Windows Defender
        shell: pwsh
        run: |
          $mp = 'C:\Program Files\Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mp)) { throw "MpCmdRun.exe nao encontrado neste runner" }
          try { & $mp -SignatureUpdate } catch { Write-Host "SignatureUpdate falhou (seguindo com as assinaturas atuais): $_" }

          $resumo = @()
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            $f = $_.FullName
            Write-Host "`n== Escaneando $($_.Name) =="
            & $mp -Scan -ScanType 3 -File $f -DisableRemediation
            $code = $LASTEXITCODE
            Write-Host "Codigo de saida: $code"
            $resumo += [pscustomobject]@{ Arquivo = $_.Name; CodigoSaida = $code }
          }

          Write-Host "`n== Ameacas detectadas (historico do scan) =="
          $threats = Get-MpThreat -ErrorAction SilentlyContinue
          $threats | Format-List

          "## Resultado do scan do Defender" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Arquivo | Codigo de saida (0 = limpo) |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($r in $resumo) {
            "| $($r.Arquivo) | $($r.CodigoSaida) |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($threats) {
            "### Ameacas nomeadas" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $threats | ForEach-Object { "- $($_.ThreatName) em $($_.Resources)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          } else {
            "Nenhuma ameaca nomeada pelo Get-MpThreat." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-packaging-test
          path: out/*
